server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:auth}
    username: ${DB_USER:auth}
    password: ${DB_PASSWORD:auth}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    issuer: ${JWT_ISSUER:smartstock-auth}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:file:./secrets/jwt_private_key}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:file:./secrets/jwt_public_key}
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@smartstock.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.smartstock.auth: INFO
