server:
  port: 8080
  # Derrière nginx (seul point d'entrée) : URL publique reconstruite depuis X-Forwarded-*.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    issuer: ${JWT_ISSUER:smartstock-auth}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:file:./secrets/jwt_public_key}
  # Secret partagé order-service ↔ inventory-service (voir InternalCallVerifier).
  internal-token: ${INTERNAL_API_TOKEN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.smartstock.inventory: INFO
