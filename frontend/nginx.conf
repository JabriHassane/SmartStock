# Sert le build Angular en statique et route /api et /ws vers la gateway
# Spring Cloud. Même pattern que MyPortfolio/azwebsite : proxy_pass via
# une variable ($upstream_gateway) résolue à la requête (resolver
# 127.0.0.11, le DNS interne de Docker) plutôt qu'au chargement de la
# config — sinon nginx refuse de démarrer ("host not found in upstream")
# si la gateway n'est pas encore up (ex: juste après un `docker compose up`
# ou un redémarrage de l'hôte), et reste bloqué en restart-loop.
server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 5m;

    location /api/ {
        set $upstream_gateway gateway:8080;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard temps réel (STOMP/SockJS ou WS natif) exposé par la
    # gateway, alimenté par les événements Kafka du notification-service.
    location /ws/ {
        set $upstream_gateway gateway:8080;
        proxy_pass http://$upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
