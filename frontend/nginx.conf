# Sert le build Angular et route /api/* vers le microservice concerné selon
# le préfixe, en attendant la `gateway` prévue dans l'architecture cible
# (README.md). À la mise en place de `gateway` : remplacer les trois
# upstreams ci-dessous par "gateway:8080" et ajouter le routage `/ws/`.
#
# TLS auto-signé + réseaux internal/edge + publication IP Tailscale :
# même pattern que MyPortfolio/azwebsite/video-dl-sass sur ce serveur
# (voir docker-compose.prod.yml et DEPLOY.md).

# Tout le trafic public arrive par le tunnel Cloudflare (cloudflared tourne
# sur l'hôte), donc $remote_addr est le même pour tous les visiteurs :
# limiter dessus bloquerait tout le site d'un coup. CF-Connecting-IP est
# posé par le edge Cloudflare sur chaque requête — on limite sur cette
# valeur, avec $remote_addr en repli (accès direct via Tailscale).
map $http_cf_connecting_ip $rate_limit_key {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

limit_req_zone $rate_limit_key zone=api_general:10m rate=20r/s;
limit_req_zone $rate_limit_key zone=api_login:10m rate=5r/m;
# 429 Too Many Requests (au lieu du 503 par défaut) : le frontend affiche « Trop de tentatives ».
limit_req_status 429;

server {
    # Publié sur 127.0.0.1 et l'IP Tailscale de l'hôte (voir
    # docker-compose.prod.yml) — jamais 0.0.0.0. Le cloudflared de l'hôte
    # route le hostname public vers localhost:8446, avec "No TLS Verify"
    # activé puisque ce cert n'est pas signé par une CA publique.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost 100.103.213.104 smart-stock.azwebtech.net;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # DNS interne de Docker — les proxy_pass ci-dessous résolvent les noms
    # des services à la requête (via une variable) plutôt qu'au chargement
    # de la config, sinon nginx refuse de démarrer ("host not found in
    # upstream") si un service n'est pas encore up, et reste bloqué en
    # restart-loop.
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # connect-src 'self' : le frontend n'appelle que /api sur son propre
    # domaine (même origine) — aucune URL d'API absolue, aucun CORS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # proxy_pass ne doit PAS porter d'URI une fois qu'il utilise une
    # variable : nginx enverrait sinon ce texte littéral au lieu de l'URI
    # d'origine. Sans URI, la requête est relayée telle quelle.
    location = /api/auth/login {
        limit_req zone=api_login burst=5 nodelay;
        set $upstream_auth auth-service:8080;
        proxy_pass http://$upstream_auth;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location ~ ^/api/(auth|users)(/|$) {
        limit_req zone=api_general burst=40 nodelay;
        set $upstream_auth auth-service:8080;
        proxy_pass http://$upstream_auth;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Endpoint service-à-service (order-service → inventory-service sur le
    # réseau internal) : jamais exposé publiquement, même avec un JWT valide.
    location ^~ /api/stock/movements/batch {
        return 404;
    }

    location ~ ^/api/(categories|products|warehouses|stock|dashboard/inventory)(/|$) {
        limit_req zone=api_general burst=40 nodelay;
        set $upstream_inventory inventory-service:8080;
        proxy_pass http://$upstream_inventory;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location ~ ^/api/(suppliers|customers|orders|dashboard/orders)(/|$) {
        limit_req zone=api_general burst=40 nodelay;
        set $upstream_order order-service:8080;
        proxy_pass http://$upstream_order;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/ {
        return 404;
    }

    # Fichiers buildés avec hash dans le nom : cache long et immuable.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html jamais mis en cache, pour qu'un redéploiement soit pris
    # en compte immédiatement.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
